<!--
        - #RESUME
      -->
      <article class="resume" data-page="resume">

        <header>
          <h2 class="h2 article-title">Resume</h2>
        </header>

        <!--
        - #EDUCATION
        -->
        <section class="timeline">
          <div class="title-wrapper">
            <div class="icon-box">
              <ion-icon name="book-outline"></ion-icon>
            </div>
            <h3 class="h3">Education</h3>
          </div>
          <ol class="timeline-list">
            <!-- Education items serão carregados dinamicamente -->
          </ol>
        </section>

        <!--
        - #EXPERIENCE
        -->
        <section class="timeline">
          <div class="title-wrapper">
            <div class="icon-box">
              <ion-icon name="briefcase-outline"></ion-icon>
            </div>
            <h3 class="h3">Experience</h3>
          </div>
          <ol class="timeline-list">
            <!-- Experience items serão carregados dinamicamente -->
          </ol>
        </section>

        <!--
        - #SKILLS
        -->
        <section class="skill">
          <h3 class="h3 skills-title">My skills</h3>
          <ul class="skills-list content-card">
            <!-- Skills serão carregadas dinamicamente -->
          </ul>
        </section>

        <!--
        - #CERTIFICATIONS
        -->
        <section class="clients">
          <h3 class="h3 clients-title">Certifications</h3>
          <ul class="clients-list has-scrollbar">
            <!-- Certificados serão carregados dinamicamente -->
          </ul>
        </section>
